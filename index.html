<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMA BANK — Admin Cafétéria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --navy-950:#040B18; --navy-900:#081831; --navy-800:#0C2350; --navy-700:#153274; --navy-600:#2748A0; --navy-500:#3E5FC4;
  --navy-100:#E8EDF8; --navy-50:#F3F6FC; --white:#FFFFFF; --surface:#FFFFFF; --ink:#0A1B3D; --muted:#647096; --muted-2:#8792B0;
  --line:#E2E8F5; --pos:#1B8F5A; --pos-bg:#E7F6EE; --neg:#C4433F; --neg-bg:#FBEAEA; --warn:#A9761B; --warn-bg:#FDF3DC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Inter',sans-serif;background:var(--navy-50);color:var(--ink);}
h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
.tnum{font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
.cur{height:0.85em;width:auto;vertical-align:-0.12em;filter:brightness(0);margin-right:2px;}

/* ---------- LOGIN GATE ---------- */
#gate{position:fixed;inset:0;background:radial-gradient(120% 100% at 50% 0%,var(--navy-700) 0%,var(--navy-900) 55%,var(--navy-950) 100%);display:flex;align-items:center;justify-content:center;z-index:999;}
.gate-card{width:380px;max-width:90vw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:36px 30px;color:#fff;}
.gate-card .mark{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--navy-900);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:18px;margin-bottom:14px;}
.gate-card h1{font-size:19px;margin:0 0 4px;}
.gate-card p{color:#A9B8E4;font-size:12.5px;margin:0 0 22px;}
.gate-card input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;font-size:14px;margin-bottom:12px;outline:none;}
.gate-card button{width:100%;padding:13px;border-radius:12px;border:none;background:#fff;color:var(--navy-900);font-weight:700;font-size:13.5px;}
.gate-hint{margin-top:16px;font-size:11px;color:#8CA0DE;line-height:1.7;}
.gate-err{color:#F3A6A6;font-size:12px;margin:-6px 0 10px;}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy-950),var(--navy-800));color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;}
.sb-brand .mark{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--navy-900);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:15px;flex-shrink:0;}
.sb-brand .txt b{display:block;font-family:'Manrope';font-weight:800;font-size:14.5px;}
.sb-brand .txt span{display:block;font-size:10.5px;color:#96A8DC;}
.sb-school{margin:6px 8px 18px;font-size:11px;color:#7C8BC0;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:none;border:none;color:#B9C6EE;font-size:13px;font-weight:600;text-align:left;width:100%;}
.sb-link:hover{background:rgba(255,255,255,.06);}
.sb-link.active{background:rgba(255,255,255,.12);color:#fff;}
.sb-link .badge-mini{margin-left:auto;background:var(--neg);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:10px;}
.sb-logout{margin-top:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 28px;}
.search-wrap{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--navy-50);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);}
.search-wrap input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--ink);font-family:inherit;}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:1.5px solid var(--surface);}
.top-profile{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:30px;}
.top-profile .av{width:30px;height:30px;border-radius:50%;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Manrope';}
.top-profile b{font-size:12.5px;}
.top-profile small{display:block;color:var(--muted);font-size:10.5px;}

.content{padding:26px 28px 60px;max-width:1400px;}
.page-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title h1{font-size:22px;margin:0;}
.page-title p{color:var(--muted);font-size:12.5px;margin:3px 0 0;}

/* ---------- COMPONENTS (reused patterns) ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0;overflow:hidden;}
.kpi-card .kl{font-size:12px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px;}
.kpi-card .kv{font-family:'Manrope';font-weight:800;font-size:24px;margin:0;}
.kpi-card .kd{font-size:11px;margin-top:6px;font-weight:700;}
.kicon{width:34px;height:34px;border-radius:10px;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;}

.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:22px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;overflow:hidden;}
.card canvas{max-width:100%;display:block;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-head h3{font-size:14.5px;margin:0;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{border:1px solid var(--line);background:var(--navy-50);border-radius:20px;padding:6px 13px;font-size:11.5px;font-weight:700;color:var(--muted);}
.pill.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}

.table{width:100%;border-collapse:collapse;}
.table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2);padding:0 12px 10px;font-weight:700;}
.table td{padding:12px;border-top:1px solid var(--line);font-size:12.5px;}
.table tr:hover td{background:var(--navy-50);cursor:pointer;}
.name-cell{display:flex;align-items:center;gap:10px;}
.av-sm{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Manrope';flex-shrink:0;}
.badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;display:inline-block;}
.badge.ok{background:var(--pos-bg);color:var(--pos);}
.badge.pending{background:var(--warn-bg);color:var(--warn);}
.badge.fail{background:var(--neg-bg);color:var(--neg);}
.badge.mut{background:var(--navy-100);color:var(--muted);}
.trow{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;}
.trow:hover{background:var(--navy-50);}
.trow:last-child{border-bottom:none;}
.tleft{flex:1;min-width:0;}
.tleft b{font-size:13px;display:block;}
.tleft small{color:var(--muted);font-size:11.5px;}
.tx-icn-lite{width:36px;height:36px;border-radius:10px;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cur-badge-lg{width:52px;height:52px;border-radius:50%;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;margin:0 auto;}

.subnav{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.subnav button{background:none;border:none;padding:10px 4px;margin-right:18px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;}
.subnav button.active{color:var(--navy-800);border-color:var(--navy-800);}

.btn{border:none;border-radius:10px;padding:9px 15px;font-size:12px;font-weight:700;}
.btn.primary{background:var(--navy-800);color:#fff;}
.btn.ghost{background:var(--navy-50);color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:var(--neg-bg);color:var(--neg);}
.btn.ok{background:var(--pos-bg);color:var(--pos);}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,11,24,.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;}
.modal-bg.open{opacity:1;pointer-events:auto;}
.modal-box{background:var(--surface);border-radius:20px;width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:24px;transform:scale(.96);transition:transform .18s;}
.modal-bg.open .modal-box{transform:scale(1);}
.modal-box h3{margin:0 0 14px;font-size:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13px;font-family:inherit;outline:none;}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px;border-top:1px solid var(--line);}
.summary-row:first-child{border-top:none;}
.close-x{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:30px;font-size:12.5px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}

.toggle{width:40px;height:23px;border-radius:20px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.toggle.on{background:var(--navy-700);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2.5px;left:3px;transition:.15s;}
.toggle.on::after{left:19px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);}
.settings-row:first-child{border-top:none;}
.settings-row .st{font-size:13px;font-weight:600;}
.settings-row small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px;}

@media (max-width:980px){
  .sidebar{width:76px;}
  .sb-brand .txt,.sb-school,.sb-link span{display:none;}
  .sb-link{justify-content:center;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card" id="gate-card">
    <div class="mark">🍽</div>
    <h1>Cafétéria — Administration</h1>
    <p>Gestion du menu, du stock et des commandes</p>
    <div id="gate-body">Chargement…</div>
  </div>
</div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   ICONS
============================================================ */
const ICONS = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1V15h4v4.5a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V10"/>',
  users:'<circle cx="8.5" cy="8" r="3"/><path d="M2.5 20.5c0-3.6 2.8-6 6-6s6 2.4 6 6"/><circle cx="16.5" cy="8" r="2.8"/><path d="M14.5 3.7a2.8 2.8 0 0 1 0 8.6"/><path d="M15 14.7c2.4.4 4.5 2.5 4.5 5.8"/>',
  bank:'<rect x="4.5" y="3" width="15" height="18" rx="1.5"/><path d="M9.5 21v-4.5h5V21"/><path d="M8 7.5h1.2M14.8 7.5H16M8 11.5h1.2M14.8 11.5H16"/>',
  card:'<rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><path d="M6 14.5h4"/>',
  trend:'<path d="M3 17 9 10l4 3 8-9"/><path d="M15 3.5h6V9.5"/>',
  food:'<path d="M5 3v7a2.4 2.4 0 0 0 2.4 2.4V21"/><path d="M8.7 3v6.4"/><path d="M15 3c-1.8 0-3 2.2-3 5s1.2 4.6 3 4.6V21"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16l3.5-5 3 3L19 8"/>',
  shield:'<path d="M12 2.5 20 6v6c0 5.2-3.6 8.9-8 10.5-4.4-1.6-8-5.3-8-10.5V6l8-3.5Z"/><path d="m9 12 2 2 4-4.2"/>',
  bell:'<path d="M6.5 8.5a5.5 5.5 0 0 1 11 0c0 5 2 6.3 2 6.3H4.5s2-1.3 2-6.3Z"/><path d="M10 18a2 2 0 0 0 4 0"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2.1 2.1 0 1 1-3 3l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2.1 2.1 0 1 1-4.2 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2.1 2.1 0 1 1-3-3l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2.1 2.1 0 1 1 0-4.2h.1A1.7 1.7 0 0 0 4.7 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2.1 2.1 0 1 1 3-3l.1.1a1.7 1.7 0 0 0 1.9.3H9.4A1.7 1.7 0 0 0 10.4 3V3a2.1 2.1 0 1 1 4.2 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2.1 2.1 0 1 1 3 3l-.1.1a1.7 1.7 0 0 0-.3 1.9V9.4a1.7 1.7 0 0 0 1.6 1H21a2.1 2.1 0 1 1 0 4.2h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  logout:'<path d="M9.5 20.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h3.5"/><path d="M16.5 16.5 21 12l-4.5-4.5"/><path d="M21 12H9.5"/>',
  search:'<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
  alert:'<path d="M12 9v4.2"/><circle cx="12" cy="16.5" r=".6" fill="currentColor" stroke="none"/><path d="M10.6 3.5 1.9 18.2A1.9 1.9 0 0 0 3.6 21h16.8a1.9 1.9 0 0 0 1.7-2.8L13.4 3.5a1.9 1.9 0 0 0-2.8 0Z"/>',
  lock:'<rect x="4.5" y="11" width="15" height="9.5" rx="2.2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  wallet:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h11A2.5 2.5 0 0 1 19 7.5V8H5.5A2.5 2.5 0 0 1 3 5.5"/><path d="M3 8v9a2.5 2.5 0 0 0 2.5 2.5H19A2 2 0 0 0 21 17.5v-7A2 2 0 0 0 19 8.5H5"/><circle cx="16.2" cy="13.5" r="1.3"/>',
  box:'<path d="M3.5 8 12 3.5 20.5 8 12 12.5 3.5 8Z"/><path d="M3.5 8v9L12 21.5 20.5 17V8"/><path d="M12 12.5V21.5"/>',
  cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/><path d="M2.5 3.5h2.3L7.2 15h11.4l2.4-8.5H5.6"/>',
  tag:'<path d="M11.5 3.5H4.5a1 1 0 0 0-1 1v7l10.5 10.5a1 1 0 0 0 1.4 0l7.1-7.1a1 1 0 0 0 0-1.4L11.5 3.5Z"/><circle cx="8" cy="8" r="1.4"/>',
  receipt:'<path d="M6 3.5h12v17l-2.5-1.6L13 20.5l-2.5-1.6L8 20.5l-2-1.6V3.5Z"/><path d="M9 8h6M9 12h6M9 16h3"/>',

async function loadFromSupabase(){
  const [prodRes, orderRes, moveRes, setRes, menuRes] = await Promise.all([
    sb.from('cafeteria_products').select('*').order('name'),
    sb.from('cafeteria_orders').select('*').order('created_at',{ascending:false}),
    sb.from('stock_movements').select('*').order('created_at',{ascending:false}),
    sb.from('app_settings').select('*').eq('key','cafeteria').maybeSingle(),
    sb.from('daily_menu').select('*').order('weekday'),
  ]);
  PRODUCTS = (prodRes.data||[]).map(p=>({id:p.id, name:p.name, emoji:p.emoji, category:p.category, price:Number(p.price), stock:p.stock, threshold:p.threshold, status:p.status, updated:new Date(p.updated_at)}));
  ORDERS = (orderRes.data||[]).map(o=>({id:o.id, txId:o.tx_id, proofCode:o.proof_code, accountNumber:o.account_number, client:o.client_name, type:o.client_type, classe:o.classe, items:o.items||[], total:Number(o.total), payment:o.payment, status:o.status, date:new Date(o.created_at)}));
  STOCK_MOVEMENTS = (moveRes.data||[]).map(m=>({product:m.product_name, type:m.type, qty:m.qty, date:new Date(m.created_at), supplier:m.supplier, note:m.note}));
  DAILY_MENU = (menuRes.data||[]).map(m=>({id:m.id, weekday:m.weekday, productId:m.product_id}));
  if(setRes.data && setRes.data.value){ Object.assign(SETTINGS, setRes.data.value); }
}
async function syncAll(){ await loadFromSupabase(); if(document.getElementById('gate').style.display==='none') renderPage(); }
function startRealtime(){
  sb.channel('cafeteria-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'cafeteria_products'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'cafeteria_orders'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'stock_movements'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'daily_menu'}, syncAll)
    .subscribe();
}

const readStockAlerts = new Set();
function stockNotifications(){
  return PRODUCTS.filter(p=>stockStatus(p)!=='ok').map(p=>{
    const rupture = stockStatus(p)==='rupture';
    return {
      id:'stock-'+p.id,
      text: rupture ? `Produit en rupture : ${p.name}.` : `Stock faible : ${p.name} (${p.stock} restants).`,
      date: p.updated,
      read: readStockAlerts.has(p.id),
      productId: p.id,
    };
  }).sort((a,b)=>b.date-a.date);
}

async function gateLogin(){
  const id = document.getElementById('ga-select').value;

  currentAdmin = admin;
  enterApp();
}

function go(page){ state.page=page; renderApp(); }
function renderPage(){
  const c = document.getElementById('content');
  const pages = {dashboard:pgDashboard,menujour:pgMenuJour,menu:pgMenu,stock:pgStock,commandes:pgCommandes,paiements:pgPaiements,analytics:pgAnalytics,notifications:pgNotifications,parametres:pgParametres};
  c.innerHTML = (pages[state.page]||pgDashboard)();
  requestAnimationFrame(()=>{ drawCharts(); ensureTicker(); });
}
function globalSearch(q){
  q=q.trim().toLowerCase();
  if(q.length<2){ toast('Tapez au moins 2 caractères'); return; }
  if(PRODUCTS.some(p=>p.name.toLowerCase().includes(q))){ go('menu'); return; }
  if(ORDERS.some(o=>o.id.toLowerCase().includes(q)||o.client.toLowerCase().includes(q))){ go('commandes'); return; }
  toast('Aucun résultat');
}

function pgDashboard(){
  const today = new Date().toDateString();
  const todayOrders = ORDERS.filter(o=>o.date.toDateString()===today && o.status!=='Annulée');

  const medals=['🥇','🥈','🥉'];

    <div class="kpi-card"><p class="kl"><span class="kicon">${icon('cart',16)}</span>Commandes aujourd'hui</p><p class="kv">${todayOrders.length}</p></div>
    <div class="kpi-card"><p class="kl"><span class="kicon">${icon('food',16)}</span>Produits vendus</p><p class="kv">${itemsSold}</p></div>
    <div class="kpi-card"><p class="kl"><span class="kicon">${icon('box',16)}</span>Stock faible</p><p class="kv" style="color:${lowStockCount()?'var(--neg)':'inherit'}">${lowStockCount()}</p></div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-head"><h3>Ventes <span style="color:var(--pos);font-size:11px;font-weight:600;">● en direct</span></h3>
        <div class="filter-pills">${["Aujourd'hui",'7j','30j','3 mois'].map((p,i)=>`<div class="pill ${i===0?'active':''}">${p}</div>`).join('')}</div>
      </div>
      <canvas id="sales-chart" height="150"></canvas>
    </div>
    <div class="card">
      <div class="card-head"><h3>Produits populaires</h3></div>
      ${popular.map(([name,qty],i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;">
          <span style="width:22px;">${medals[i]||(i+1)+'.'}</span><b style="flex:1;">${name}</b><span style="color:var(--muted);">${qty} vendus</span>
        </div>`).join('') || `<div class="empty">Aucune donnée</div>`}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Commandes récentes</h3><button class="btn ghost" onclick="go('commandes')">Voir tout</button></div>
    <table class="table"><thead><tr><th>ID</th><th>Client</th><th>Montant</th><th>Heure</th><th>Statut</th></tr></thead>
    <tbody>${ORDERS.slice().sort((a,b)=>b.date-a.date).slice(0,5).map(o=>`
      <tr onclick="openOrderDetail('${o.id}')"><td>${o.id}</td><td>${o.client}</td><td class="tnum">${money(o.total)}</td><td>${o.date.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td><td>${statusBadge(o.status)}</td></tr>
    `).join('')}</tbody></table>

function statusBadge(s){
  const map={'En attente':'pending','Payée':'ok','En préparation':'pending','Prête':'ok','Servie':'mut','Annulée':'fail'};

let menuJourDay = todayWeekday() || 1;
function pgMenuJour(){
  const dayItems = DAILY_MENU.filter(m=>m.weekday===menuJourDay).map(m=>PRODUCTS.find(p=>p.id===m.productId)).filter(Boolean);
  const today = todayWeekday();
  return `
  <div class="page-title"><div><h1>Menu du jour</h1><p>Programmez le menu fixe de chaque jour d'école — il ne change pas d'une semaine à l'autre</p></div></div>
  ${today ? `<div class="notif-banner" style="margin-bottom:14px;"><div class="ic">${icon('check',18)}</div><p>Nous sommes <b>${WEEKDAY_NAMES[today]}</b> — c'est ce menu que "index" affiche en ce moment aux élèves.</p></div>` : `<div class="notif-banner" style="margin-bottom:14px;"><div class="ic">${icon('alert',18)}</div><p>Nous sommes en week-end — aucun menu actif côté élèves aujourd'hui.</p></div>`}
  <div class="filter-pills" style="margin-bottom:16px;">${[1,2,3,4,5].map(d=>`<div class="pill ${menuJourDay===d?'active':''} ${today===d?'':''}" onclick="menuJourDay=${d};renderPage()">${WEEKDAY_NAMES[d]}${today===d?' •':''}</div>`).join('')}</div>
  <div class="card">
    <div class="card-head"><h3>${WEEKDAY_NAMES[menuJourDay]} — ${dayItems.length} article(s) au menu</h3></div>
    <table class="table"><thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Action</th></tr></thead>
    <tbody>${dayItems.map(p=>`
      <tr><td><div class="name-cell"><span style="font-size:18px;">${p.emoji}</span>${p.name}</div></td><td>${p.category}</td><td class="tnum">${money(p.price)}</td>
      <td><button class="btn danger" onclick="removeFromDailyMenu('${p.id}')">Retirer</button></td></tr>
    `).join('') || `<tr><td colspan="4"><div class="empty">Aucun article programmé pour ${WEEKDAY_NAMES[menuJourDay]}</div></td></tr>`}</tbody></table>
  </div>
  <div class="card-head" style="margin:20px 0 8px;"><h3>Ajouter au menu de ${WEEKDAY_NAMES[menuJourDay]}</h3></div>
  <div class="card">
    <table class="table"><thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Action</th></tr></thead>
    <tbody>${PRODUCTS.filter(p=>!dayItems.some(d=>d.id===p.id)).map(p=>`
      <tr><td><div class="name-cell"><span style="font-size:18px;">${p.emoji}</span>${p.name}</div></td><td>${p.category}</td><td class="tnum">${money(p.price)}</td>
      <td><button class="btn ok" onclick="addToDailyMenu('${p.id}')">+ Ajouter</button></td></tr>
    `).join('') || `<tr><td colspan="4"><div class="empty">Tous les produits sont déjà au menu de ce jour</div></td></tr>`}</tbody></table>
  </div>`;
}
async function addToDailyMenu(productId){
  const id = genId('DM');
  await sb.from('daily_menu').insert({id, weekday:menuJourDay, product_id:productId});
  DAILY_MENU.push({id, weekday:menuJourDay, productId});
  renderPage(); toast('Ajouté au menu de '+WEEKDAY_NAMES[menuJourDay]);
}
async function removeFromDailyMenu(productId){
  const entry = DAILY_MENU.find(m=>m.weekday===menuJourDay && m.productId===productId);
  if(!entry) return;
  await sb.from('daily_menu').delete().eq('id',entry.id);
  DAILY_MENU = DAILY_MENU.filter(m=>m.id!==entry.id);
  renderPage(); toast('Retiré du menu');
}

function toggleProductStatus(id){ const p=PRODUCTS.find(x=>x.id===id); p.status = p.status==='disponible'?'indisponible':'disponible'; sb.from('cafeteria_products').update({status:p.status}).eq('id',id); renderPage(); toast('Statut mis à jour'); }
function deleteProduct(id){ if(!confirm('Supprimer ce produit ?')) return; PRODUCTS = PRODUCTS.filter(p=>p.id!==id); sb.from('cafeteria_products').delete().eq('id',id); renderPage(); toast('Produit supprimé'); }
function openProductForm(id){
  const p = id ? PRODUCTS.find(x=>x.id===id) : null;
  openModal(`
    <button class="close-x" onclick="closeModal()">${icon('x',14)}</button>
    <h3>${p?'Modifier le produit':'Ajouter un produit'}</h3>
    <div class="field"><label>Nom</label><input id="pf-name" value="${p?p.name:''}" placeholder="Ex. Burger"></div>
    <div class="field"><label>Emoji / photo</label><input id="pf-emoji" value="${p?p.emoji:'🍽'}" maxlength="2"></div>
    <div class="field"><label>Catégorie</label><select id="pf-cat">${CATEGORIES.map(c=>`<option ${p&&p.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Prix</label><input id="pf-price" type="number" value="${p?p.price:''}" placeholder="0"></div>
    <div class="field"><label>Stock initial</label><input id="pf-stock" type="number" value="${p?p.stock:''}" placeholder="0"></div>
    <div class="field"><label>Seuil d'alerte</label><input id="pf-threshold" type="number" value="${p?p.threshold:10}" placeholder="10"></div>
    <button class="btn primary" style="width:100%;" onclick="saveProduct(${p?`'${p.id}'`:'null'})">${p?'Enregistrer':'Ajouter le produit'}</button>
  `);
}
async function saveProduct(id){
  const name=document.getElementById('pf-name').value.trim();
  const emoji=document.getElementById('pf-emoji').value.trim()||'🍽';
  const category=document.getElementById('pf-cat').value;
  const price=parseFloat(document.getElementById('pf-price').value)||0;
  const stock=parseInt(document.getElementById('pf-stock').value)||0;
  const threshold=parseInt(document.getElementById('pf-threshold').value)||10;
  if(!name){ toast('Nom requis'); return; }
  if(id){
    const p=PRODUCTS.find(x=>x.id===id);
    Object.assign(p,{name,emoji,category,price,stock,threshold,updated:new Date()});
    await sb.from('cafeteria_products').update({name,emoji,category,price,stock,threshold}).eq('id',id);
  } else {
    const newId = genId('P');
    PRODUCTS.push({id:newId,name,emoji,category,price,stock,threshold,status:'disponible',updated:new Date()});
    await sb.from('cafeteria_products').insert({id:newId,name,emoji,category,price,stock,threshold,status:'disponible'});
  }
  closeModal(); renderPage(); toast('Produit enregistré');
}

  return `

    <div style="display:flex;gap:8px;"><button class="btn ok" onclick="openStockMove('Entrée')">+ Entrée de stock</button><button class="btn danger" onclick="openStockMove('Sortie')">− Sortie de stock</button></div>

    <tbody>${PRODUCTS.map(p=>{
      const st=stockStatus(p);
      const badge = st==='rupture'?`<span class="badge fail">🔴 Rupture</span>`:st==='faible'?`<span class="badge pending">🟠 Stock faible</span>`:`<span class="badge ok">🟢 Disponible</span>`;
      return `<tr><td><div class="name-cell"><span style="font-size:18px;">${p.emoji}</span>${p.name}</div></td><td>${p.stock}</td><td>${p.threshold}</td><td>${badge}</td><td>${p.updated.toLocaleDateString('fr-FR')}</td></tr>`;
    }).join('')}</tbody></table>
  </div>
  <div class="card-head" style="margin:20px 0 8px;"><h3>Historique des mouvements</h3></div>
  <div class="card">
    <table class="table"><thead><tr><th>Produit</th><th>Type</th><th>Quantité</th><th>Date</th><th>Note</th></tr></thead>
    <tbody>${STOCK_MOVEMENTS.slice().sort((a,b)=>b.date-a.date).map(m=>`
      <tr><td>${m.product}</td><td>${m.type==='Entrée'?`<span class="badge ok">Entrée</span>`:`<span class="badge fail">Sortie</span>`}</td><td>${m.qty}</td><td>${m.date.toLocaleString('fr-FR')}</td><td>${m.note||'—'}</td></tr>
    `).join('') || `<tr><td colspan="5"><div class="empty">Aucun mouvement</div></td></tr>`}</tbody></table>
  </div>`;
}
function openStockMove(type){
  openModal(`
    <button class="close-x" onclick="closeModal()">${icon('x',14)}</button>
    <h3>${type} de stock</h3>
    <div class="field"><label>Produit</label><select id="sm-prod">${PRODUCTS.map(p=>`<option value="${p.id}">${p.emoji} ${p.name}</option>`).join('')}</select></div>
    <div class="field"><label>Quantité</label><input id="sm-qty" type="number" placeholder="0"></div>
    ${type==='Entrée'?`<div class="field"><label>Fournisseur</label><input id="sm-sup" placeholder="Ex. Boulangerie Centrale"></div><div class="field"><label>Prix d'achat</label><input id="sm-cost" type="number" placeholder="0"></div>`:`<div class="field"><label>Motif</label><input id="sm-reason" placeholder="Ex. Périmé, Vente"></div>`}
    <div class="field"><label>Note</label><input id="sm-note" placeholder="Optionnel"></div>
    <button class="btn primary" style="width:100%;" onclick="saveStockMove('${type}')">Enregistrer</button>
  `);
}
async function saveStockMove(type){
  const pid = document.getElementById('sm-prod').value;
  const qty = parseInt(document.getElementById('sm-qty').value);
  const note = document.getElementById('sm-note').value;
  if(!qty||qty<=0){ toast('Quantité invalide'); return; }
  const p = PRODUCTS.find(x=>x.id===pid);
  p.stock += type==='Entrée' ? qty : -qty;
  if(p.stock<0) p.stock=0;
  p.updated = new Date();
  STOCK_MOVEMENTS.unshift({product:p.name, type, qty, date:new Date(), note});
  await Promise.all([
    sb.from('cafeteria_products').update({stock:p.stock}).eq('id',p.id),
    sb.from('stock_movements').insert({product_id:p.id, product_name:p.name, type, qty, note}),
  ]);
  closeModal(); renderPage(); toast(type+' enregistrée');
}

function openOrderDetail(id){
  const o = ORDERS.find(x=>x.id===id);
  const canAdvance = !['Servie','Annulée'].includes(o.status);
  openModal(`
    <button class="close-x" onclick="closeModal()">${icon('x',14)}</button>
    <h3>Commande</h3>
    <div style="text-align:center;background:var(--navy-50);border-radius:14px;padding:14px;margin-bottom:14px;">
      <p style="margin:0 0 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;">Code de preuve — à demander à l'acheteur</p>
      <p style="margin:0;font-family:'Manrope';font-weight:800;font-size:28px;letter-spacing:6px;">${o.proofCode||'----'}</p>
    </div>
    <div class="summary-row"><span>Client</span><b>${o.client} (${o.type})</b></div>
    <div class="summary-row"><span>Paiement</span><b>${o.payment}</b></div>
    <div class="summary-row"><span>Date</span><b>${o.date.toLocaleString('fr-FR')}</b></div>
    <div class="summary-row"><span>Statut</span><b>${statusBadge(o.status)}</b></div>
    <div style="margin:14px 0;">
      ${o.items.map(i=>`<div class="summary-row"><span>${i.qty}× ${i.name}</span><b class="tnum">${money(i.price*i.qty)}</b></div>`).join('')}
      <div class="summary-row"><span><b>Total</b></span><b class="tnum">${money(o.total)}</b></div>
    </div>
    ${canAdvance?`<button class="btn primary" style="width:100%;" onclick="advanceOrder('${o.id}')">Passer à « ${nextStatus(o.status)} »</button>`:''}
    ${o.status!=='Annulée'&&o.status!=='Servie'?`<button class="btn danger" style="width:100%;margin-top:8px;" onclick="cancelOrder('${o.id}')">Annuler la commande</button>`:''}
  `);
}
async function advanceOrder(id){
  const o = ORDERS.find(x=>x.id===id);
  o.status = nextStatus(o.status);
  const writes = [sb.from('cafeteria_orders').update({status:o.status}).eq('id',id)];
  if(o.status==='Prête' && o.accountNumber){
    writes.push(sb.from('notifications').insert({id:genId('N'), account_number:o.accountNumber, text:`Votre commande à la cafétéria (${o.id}) est prête !`, read:false}));
  }
  await Promise.all(writes);
  closeModal(); renderPage(); toast('Statut mis à jour : '+o.status);
}
async function cancelOrder(id){
  const o = ORDERS.find(x=>x.id===id);
  o.status='Annulée';
  await sb.from('cafeteria_orders').update({status:'Annulée'}).eq('id',id);
  closeModal(); renderPage(); toast('Commande annulée');
}

/* ============================================================
   PAIEMENTS
============================================================ */
function paymentBucket(d){
  const mins = (Date.now()-d.getTime())/60000;
  if(mins<5) return "À l'instant";
  if(d.toDateString()===new Date().toDateString()) return "Aujourd'hui";
  if(d.toDateString()===new Date(Date.now()-86400000).toDateString()) return 'Hier';
  return d.toLocaleDateString('fr-FR');
}
const PAY_METHOD_ICON = {'School Bank':'wallet','Carte virtuelle':'card','Solde du compte':'receipt'};
function pgPaiements(){
  const rows = ORDERS.slice().sort((a,b)=>b.date-a.date);
  rows.forEach(o=>{ if(!o.txId) o.txId=genId('HB'); });
  const paid = rows.filter(o=>o.status!=='Annulée');
  const total = paid.reduce((s,o)=>s+o.total,0);
  const refunded = rows.filter(o=>o.status==='Annulée').length;
  const byMethod = {};
  paid.forEach(o=>{ byMethod[o.payment]=(byMethod[o.payment]||0)+o.total; });

  const groups={};
  rows.forEach(o=>{ const g=paymentBucket(o.date); (groups[g]=groups[g]||[]).push(o); });

  return `
  <div class="page-title"><div><h1>Paiements</h1><p>Historique complet des transactions liées aux commandes</p></div></div>
  <div class="kpi-row">
    <div class="kpi-card"><p class="kl">${icon('wallet',16)} Total encaissé</p><p class="kv tnum">${money(total)}</p></div>
    <div class="kpi-card"><p class="kl">${icon('receipt',16)} Transactions</p><p class="kv">${rows.length}</p></div>
    <div class="kpi-card"><p class="kl">${icon('cart',16)} Remboursées</p><p class="kv" style="color:${refunded?'var(--neg)':'inherit'}">${refunded}</p></div>
    <div class="kpi-card"><p class="kl">Méthode la + utilisée</p><p class="kv" style="font-size:14px;">${Object.entries(byMethod).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}</p></div>
  </div>
  ${Object.keys(groups).length===0?`<div class="card"><div class="empty">Aucun paiement</div></div>`:
  Object.entries(groups).map(([label,list])=>`
    <div class="card-head" style="margin:18px 0 8px;"><h3 style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">${label} <span style="text-transform:none;font-weight:400;">(${list.length})</span></h3></div>
    <div class="card" style="padding:6px 8px;">
      ${list.map(o=>`
        <div class="trow" onclick="openPaymentDetail('${o.txId}')">
          <div class="tx-icn-lite">${icon(PAY_METHOD_ICON[o.payment]||'wallet',17)}</div>
          <div class="tleft"><b>${o.client}</b><small>${o.txId} · Commande ${o.id} · ${o.payment}</small></div>
          <div style="text-align:right;">
            <div class="tnum" style="font-weight:700;font-size:13px;">${money(o.total)}</div>
            ${o.status==='Annulée'?`<span class="badge fail">⚪ Remboursé</span>`:`<span class="badge ok">🟢 Payé</span>`}
          </div>
        </div>`).join('')}
    </div>`).join('')}`;
}
function openPaymentDetail(txId){
  const o = ORDERS.find(x=>x.txId===txId);
  if(!o) return;
  const subtotal = o.items.reduce((s,i)=>s+i.price*i.qty,0);
  openModal(`
    <button class="close-x" onclick="closeModal()">${icon('x',14)}</button>
    <div style="text-align:center;margin-bottom:16px;">
      <div class="cur-badge-lg">${icon(PAY_METHOD_ICON[o.payment]||'wallet',24)}</div>
      <h3 style="margin:10px 0 2px;">${money(o.total)}</h3>
      <p style="margin:0;color:var(--muted);font-size:12px;">${o.status==='Annulée'?'Remboursé':'Payé'} · ${o.date.toLocaleString('fr-FR')}</p>
    </div>
    <div class="summary-row"><span>ID transaction</span><b>${o.txId}</b></div>
    <div class="summary-row"><span>Commande liée</span><b>${o.id}</b></div>
    <div class="summary-row"><span>Client</span><b>${o.client} (${o.type}${o.classe?' · '+o.classe:''})</b></div>
    <div class="summary-row"><span>Méthode</span><b>${o.payment}</b></div>
    <div class="summary-row"><span>Statut commande</span><b>${statusBadge(o.status)}</b></div>
    <div class="card-head" style="margin:14px 0 6px;"><h3 style="font-size:12.5px;color:var(--muted);text-transform:uppercase;">Détail des articles</h3></div>
    ${o.items.map(i=>`<div class="summary-row"><span>${i.qty}× ${i.name}</span><b class="tnum">${money(i.price*i.qty)}</b></div>`).join('')}
    <div class="summary-row"><span>Sous-total</span><b class="tnum">${money(subtotal)}</b></div>
    <div class="summary-row"><span><b>Total</b></span><b class="tnum">${money(o.total)}</b></div>
    <button class="btn ghost" style="width:100%;margin-top:14px;" onclick="closeModal();openOrderDetail('${o.id}')">Voir la commande complète</button>
  `);
}

/* ============================================================
   ANALYTICS
============================================================ */
function pgAnalytics(){
  const revenue = ORDERS.filter(o=>o.status!=='Annulée').reduce((s,o)=>s+o.total,0);
  const sales={}; ORDERS.filter(o=>o.status!=='Annulée').flatMap(o=>o.items).forEach(i=>{sales[i.name]=(sales[i.name]||0)+i.qty;});
  const sorted = Object.entries(sales).sort((a,b)=>b[1]-a[1]);
  const byType={}; ORDERS.forEach(o=>{byType[o.type]=(byType[o.type]||0)+1;});
  return `
  <div class="page-title"><div><h1>Analytics</h1><p>Ventes, produits et clients de la cafétéria</p></div></div>
  <div class="kpi-row">
    <div class="kpi-card"><p class="kl">Revenus (démo)</p><p class="kv tnum">${money(revenue)}</p></div>
    <div class="kpi-card"><p class="kl">Produits les + vendus</p><p class="kv" style="font-size:14px;">${sorted[0]?sorted[0][0]:'—'}</p></div>
    <div class="kpi-card"><p class="kl">Produits les - vendus</p><p class="kv" style="font-size:14px;">${sorted[sorted.length-1]?sorted[sorted.length-1][0]:'—'}</p></div>
    <div class="kpi-card"><p class="kl">Types de clients actifs</p><p class="kv">${Object.keys(byType).length}</p></div>
  </div>
  <div class="card"><div class="card-head"><h3>Ventes <span style="color:var(--pos);font-size:11px;">● en direct</span></h3></div><canvas id="an-sales-chart" height="150"></canvas></div>
  <div class="grid-2">
    <div class="card"><div class="card-head"><h3>Ventes par produit</h3></div><canvas id="an-prod-chart" height="130"></canvas></div>
    <div class="card"><div class="card-head"><h3>Commandes par type de client</h3></div><canvas id="an-client-chart" height="130"></canvas></div>
  </div>`;
}

/* ============================================================

function markAllRead(){ PRODUCTS.forEach(p=>readStockAlerts.add(p.id)); renderPage(); }

/* ============================================================
   PARAMÈTRES
============================================================ */
function pgParametres(){
  return `
  <div class="page-title"><div><h1>Paramètres</h1><p>Configuration de la cafétéria</p></div></div>
  <div class="grid-2">
    <div class="card">
      <div class="card-head"><h3>Cafétéria</h3></div>
      <div class="field"><label>Nom</label><input id="st-nom" value="${SETTINGS.nom}"></div>
      <div class="field"><label>Horaires</label><input id="st-horaires" value="${SETTINGS.horaires}"></div>
      <div class="field"><label>Jours d'ouverture</label><input id="st-jours" value="${SETTINGS.jours}"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Commandes</h3></div>
      <div class="field"><label>Temps de préparation moyen (minutes)</label><input id="st-preptime" type="number" value="${SETTINGS.prepTime}"></div>
      <div class="field"><label>Devise</label><input value="Dollar Humanisme (HUMA)" disabled></div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Méthodes de paiement acceptées</h3></div>
    <div class="settings-row"><div class="st">School Bank<small>Paiement direct depuis le solde du compte</small></div><button class="toggle ${SETTINGS.methods.schoolbank?'on':''}" onclick="toggleMethod('schoolbank')"></button></div>
    <div class="settings-row"><div class="st">Carte virtuelle<small>Carte créée depuis "index"</small></div><button class="toggle ${SETTINGS.methods.carte?'on':''}" onclick="toggleMethod('carte')"></button></div>
    <div class="settings-row"><div class="st">Solde du compte scolaire<small>Débit direct autorisé</small></div><button class="toggle ${SETTINGS.methods.solde?'on':''}" onclick="toggleMethod('solde')"></button></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Notifications</h3></div>
    <div class="settings-row"><div class="st">Notifications push<small>Nouvelles commandes, alertes</small></div><button class="toggle ${SETTINGS.notifPush?'on':''}" onclick="toggleNotifSetting('notifPush')"></button></div>
    <div class="settings-row"><div class="st">Alertes de stock<small>Stock faible, rupture</small></div><button class="toggle ${SETTINGS.notifStock?'on':''}" onclick="toggleNotifSetting('notifStock')"></button></div>
  </div>
  <button class="btn primary" style="width:100%;margin-top:16px;" onclick="saveCafSettings()">Enregistrer les paramètres</button>`;
}
function toggleMethod(k){ SETTINGS.methods[k]=!SETTINGS.methods[k]; renderPage(); sb.from('app_settings').update({value:SETTINGS}).eq('key','cafeteria'); }
function toggleNotifSetting(k){ SETTINGS[k]=!SETTINGS[k]; renderPage(); sb.from('app_settings').update({value:SETTINGS}).eq('key','cafeteria'); }
async function saveCafSettings(){
  SETTINGS.nom = document.getElementById('st-nom').value.trim() || SETTINGS.nom;
  SETTINGS.horaires = document.getElementById('st-horaires').value.trim();
  SETTINGS.jours = document.getElementById('st-jours').value.trim();
  SETTINGS.prepTime = parseInt(document.getElementById('st-preptime').value)||15;
  await sb.from('app_settings').update({value:SETTINGS, updated_at:new Date().toISOString()}).eq('key','cafeteria');
  toast('Paramètres enregistrés');
}

/* ============================================================
   MODAL (identique au dashboard admin)
============================================================ */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-bg open" onclick="if(event.target===this)closeModal()"><div class="modal-box" style="position:relative;">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ============================================================
   CHARTS — moteur canvas maison (aucune dépendance externe)
============================================================ */
function pushSeries(){
  const last = state.financeSeries[state.financeSeries.length-1];
  let next = last + (Math.random()*10-5);
  next = Math.max(8,Math.min(55,next));
  state.financeSeries.push(next);
  if(state.financeSeries.length>28) state.financeSeries.shift();
  if(state.displaySeries.length<state.financeSeries.length) state.displaySeries.push(next);
}
const CHART_HEIGHTS = {'sales-chart':150,'an-sales-chart':150,'an-prod-chart':130,'an-client-chart':130};
function setupCanvas(cv){
  const w = Math.min(Math.max(cv.parentElement.clientWidth||300, 60), window.innerWidth-20);
  const h = CHART_HEIGHTS[cv.id] || 110;
  const dpr = window.devicePixelRatio||1;
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function drawLineFlux(id,data,color,fillColor){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const min=Math.min(...data), max=Math.max(...data), pad=8;
  const range=(max-min)||1;
  const stepX=(w-pad*2)/(data.length-1);
  const pts = data.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]);
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const mx=(x0+x1)/2; ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1); }
  ctx.lineTo(pts[pts.length-1][0],h); ctx.lineTo(pts[0][0],h); ctx.closePath();
  ctx.fillStyle=fillColor; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const mx=(x0+x1)/2; ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1); }
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],4,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
}
function drawBarChart(id,labels,data,color){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  if(data.length===0) return;
  const max = Math.max(...data)||1, pad=6, gap=8;
  const bw = (w-pad*2-gap*(data.length-1))/data.length;
  ctx.font='10px Inter, sans-serif'; ctx.textAlign='center';
  data.forEach((v,i)=>{
    const bh=(v/max)*(h-26);
    const x=pad+i*(bw+gap), y=h-20-bh;
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,bw,bh,4) : ctx.rect(x,y,bw,bh); ctx.fill();
    ctx.fillStyle='#647096';
    ctx.fillText((labels[i]||'').slice(0,8), x+bw/2, h-6);
  });
}
function drawCharts(){
  drawLineFlux('sales-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
  drawLineFlux('an-sales-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
  const sales={}; ORDERS.filter(o=>o.status!=='Annulée').flatMap(o=>o.items).forEach(i=>{sales[i.name]=(sales[i.name]||0)+i.qty;});
  drawBarChart('an-prod-chart', Object.keys(sales), Object.values(sales), '#0A1B3D');
  const byType={}; ORDERS.forEach(o=>{byType[o.type]=(byType[o.type]||0)+1;});
  drawBarChart('an-client-chart', Object.keys(byType), Object.values(byType), '#2748A0');
}
function ensureTicker(){
  if(ticker) return;
  ticker = setInterval(pushSeries, 1500);
  function frame(){
    for(let i=0;i<state.financeSeries.length;i++){
      const target = state.financeSeries[i];
      const cur = state.displaySeries[i] ?? target;
      state.displaySeries[i] = cur + (target-cur)*0.06;
    }
    while(state.displaySeries.length>state.financeSeries.length) state.displaySeries.shift();
    drawLineFlux('sales-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
    drawLineFlux('an-sales-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
